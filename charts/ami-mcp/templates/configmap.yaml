apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ami-mcp.fullname" . }}-pixi
  labels:
    {{- include "ami-mcp.labels" . | nindent 4 }}
data:
  pixi.toml: |
    [workspace]
    channels = ["conda-forge"]
    name = "ami-mcp"
    platforms = ["linux-64", "linux-aarch64"]
    version = "0.1.0"

    [dependencies]
    ami-mcp = "=={{ .Values.amiMcp.version }}"
    {{- range $name, $spec := .Values.amiMcp.extraPixiDependencies }}
    {{ $name }} = "{{ $spec }}"
    {{- end }}
  {{- if .Values.amiMcp.pixiLockContent }}
  pixi.lock: |
    {{- .Values.amiMcp.pixiLockContent | nindent 4 }}
  {{- end }}
