apiVersion: v2
name: ami-mcp
description: |
  MCP server exposing ATLAS AMI metadata queries and the PMG cross-section
  database as tools for LLMs, served over HTTP transport. Supports the
  shared-secret (single pre-authenticated client) and AF credential broker
  (per-user VOMS proxies) auth models.
type: application
# Chart version, kept in lockstep with appVersion by tbump.toml.
version: 0.2.4
# ami-mcp release the chart deploys by default (pinned into the rendered
# pixi.toml). Override with amiMcp.version in values.
appVersion: "0.2.4"
keywords:
  - ami
  - mcp
  - atlas
  - metadata
home: https://github.com/kratsg/ami-mcp
sources:
  - https://github.com/kratsg/ami-mcp
maintainers:
  - name: Giordon Stark
    email: kratsg@gmail.com
