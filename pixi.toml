[workspace]
authors = ["Giordon Stark <kratsg@gmail.com>"]
name = "ami-mcp"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
ami-mcp = { path = "./" }
setuptools = "*"
# Broker-mode client library (its [mcp] extra's mcp dependency is already a
# direct dependency of ami-mcp itself)
af-credentials = ">=0.1.0"

[package]
name = "ami-mcp"
version = "latest"

[package.build]
backend = { name = "pixi-build-python", version = "*" }
config = { noarch = true }

[package.host-dependencies]
python = ">=3.10"
uv = "*"
hatchling = ">=1.25"
hatch-vcs = ">=0.4"

[package.run-dependencies]
mcp = ">=2.0.0,<3"
ca-policy-lcg = "*"
voms = "*"
voms-lsc = "*"

[pypi-dependencies]
pyAMI-core = ">=5.1.10"
pyAMI-atlas = ">=5.1.10"

[feature.py310.dependencies]
python = "<3.11,>=3.10"

[feature.py311.dependencies]
python = "<3.12,>=3.11"

[feature.py312.dependencies]
python = "<3.13,>=3.12"

[feature.py313.dependencies]
python = "<3.14,>=3.13"

[feature.py314.dependencies]
python = "<3.15,>=3.14"

[feature.test.dependencies]
pytest = ">=9"
pytest-cov = ">=3"
pytest-asyncio = ">=0.24"
# Starlette's TestClient imports httpx internally (coexists with httpx2)
httpx = "*"

[feature.test.tasks]
test = { cmd = "pytest -m 'not slow'", description = "Run quick tests (skip slow)" }
test-cov = { cmd = "pytest -m 'not slow' --cov=ami_mcp --cov-report=term --cov-report=html", description = "Run quick tests with coverage" }
test-docstrings = { cmd = "pytest --doctest-modules src/ami_mcp", description = "Run doctests in source modules" }
test-docs = { cmd = "pytest README.md docs", description = "Run doctests in docs and README.md" }
test-slow = { cmd = "pytest --runslow", description = "Run tests including slow tests" }
test-all = { cmd = "pytest --cov=ami_mcp", description = "Run all tests with coverage" }

[feature.docs.dependencies]
zensical = "*"
lychee = "*"
pydocstyle = "*"

[feature.docs.tasks]
docs-build = { cmd = "zensical build", description = "Build documentation (static)", inputs = ["src/", "docs/", "zensical.toml"], outputs = ["site"] }
docs-linkcheck = { cmd = "lychee docs/", description = "Check documentation for broken links" }
docs-serve = { cmd = "zensical serve", depends-on = ["docs-build"], description = "Build and serve documentation" }
docs-clean = { cmd = "rm -rf site", description = "Clean documentation build artifacts", inputs = ["site"] }
check-docstrings = { cmd = "pydocstyle src/ami_mcp/", description = "Check docstring style" }

[feature.helm.dependencies]
kubernetes-helm = "*"

[feature.helm.tasks]
helm-lint = { cmd = """
helm lint charts/ami-mcp --set ingress.host=ami-mcp.example.com --set auth.sharedSecret.secretValue=dummy \
&& helm template shared charts/ami-mcp --set ingress.host=ami-mcp.example.com --set auth.sharedSecret.secretValue=dummy > /dev/null \
&& helm template broker charts/ami-mcp --set ingress.host=ami-mcp.example.com --set auth.mode=broker --set auth.broker.brokerUrl=https://broker.example.com > /dev/null \
&& helm template cvmfs charts/ami-mcp -f charts/ami-mcp/ci/cvmfs-values.yaml | grep -q 'mountPropagation: HostToContainer' \
&& helm template cvmfs charts/ami-mcp -f charts/ami-mcp/ci/cvmfs-values.yaml | grep -q 'claimName: cvmfs'
""", description = "Lint the ami-mcp Helm chart and smoke-render both auth modes + the CVMFS passthrough" }
helm-template = { cmd = "helm template a charts/ami-mcp --set ingress.host=ami-mcp.example.com --set auth.sharedSecret.secretValue=dummy", description = "Render the chart with default (shared-secret) values" }

[feature.dev.dependencies]
pre-commit = "*"
identify = ">=1.4.20"  # ruff-check
pylint = ">=3.2"
tbump = ">=6.7.0"
mypy = "*"
ruff = "*"
python-build = "*"
twine = "*"

[feature.dev.tasks]
pre-commit = { cmd = "pre-commit run --all-files", description = "Run pre-commit hooks on all files" }
pylint = { cmd = "pylint ami_mcp", description = "Run PyLint on ami-mcp package" }
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit git hooks" }
pre-commit-update = { cmd = "pre-commit autoupdate", description = "Update pre-commit hook versions" }
build-clean = { cmd = "rm -rf build dist", description = "Clean build artifacts" }
build = { cmd = "python -m build", depends-on = ["build-clean"], description = "Build SDist and wheel distributions", outputs = ["dist"] }
build-check = { cmd = "twine check --strict ./dist/*", depends-on = ["build"], description = "Run twine to check" }

[environments]
docs = ["docs"]
dev = ["dev"]
helm = { features = ["helm"], no-default-feature = true }
py310 = ["test", "py310"]
py311 = ["test", "py311"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]

[tasks]
# Composite tasks that span multiple features
lint = { depends-on = ["pre-commit", "pylint"], description = "Run all linting (pre-commit + pylint)" }
check = { depends-on = ["lint", "test"], description = "Quick check: lint + basic tests" }
check-all = { depends-on = ["lint", "test-all"], description = "Comprehensive check: lint + all tests" }
